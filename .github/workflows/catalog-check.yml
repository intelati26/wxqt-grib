# The product catalogue against each model's newest files, once a day (section 20 of docs/plans.md: "Gone or not cataloged").
# Builds the program on Linux, runs its headless check over every model (WXQT_OPEN=catalogcheck:*), and
#   - fails the run and opens (or updates) ONE issue when a field the charts ask for is GONE: it was in the model's files at the last
#     check and is not now (a renamed variable, a dropped level). The failure and the issue are the maintainer's alert;
#   - closes that issue when nothing is gone any more;
#   - first asks every model's server the question of Settings > Model Sources (WXQT_OPEN=sourcecheck:*): the state of each source (OK, Late, Moved,
#     Failing, Down, Retired); Moved, Down and Retired open (or update, or close) a second issue, label source-status. The history of the checks
#     (the run of failures) is kept in the cache with the last catalogue check, so "Down" and "Retired" mean what they say across days;
#   - asks GitHub for the newest GDAL release (the project's own, OSGeo/gdal) and compares it with the one the packages are built with (the overlay port in
#     .github/vcpkg/ports/gdal): a newer release opens (or updates, or closes) a third issue, label gdal-update, so the bundled GDAL is not left behind again;
#   - compares the other dependencies the packages are built with (vcpkg's ports, the Qt and the Actions of the workflows) with their newest releases (tools/deps_check.py: GitHub
#     releases, GitLab's tag feed for libtiff, the SQLite project's GitHub mirror feed): a major or minor version behind opens (updates, closes) a fourth issue, label deps-update;
#     patch-only differences are in the run's summary;
#   - keeps the full result (the lists of "never found" and "not cataloged" fields too) as an artifact and in the run's summary, with the field catalogue
#     (tools/catalog_report.py: families, which models have which, as CSV and Markdown).
# The last check's found fields are kept between runs in the Actions cache: the first run has nothing to compare with (nothing is gone then).
# Nothing here reports anything from anyone's computer: the project's own runner asks the public servers, nobody else is involved.
name: Catalogue check

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: catalog-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/.xdg-data
      XDG_CONFIG_HOME: ${{ github.workspace }}/.xdg-config
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      # The same Qt as the packages (the official binaries, see build.yml), not Ubuntu's 6.4.2
      - name: Install Qt (official binaries)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Install build dependencies
        timeout-minutes: 15
        run: |
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            if sudo apt-get $apt_opts update && sudo apt-get $apt_opts install -y --no-install-recommends \
                g++ make \
                libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxkbcommon-dev libxcb-cursor0 libfontconfig1-dev libfreetype-dev libdbus-1-3 \
                webp; then
              exit 0
            fi
            echo "apt failed (attempt $attempt of 3); trying again in $((attempt * 20)) seconds"
            sleep $((attempt * 20))
          done
          exit 1

      # The same GDAL as the packages (the vcpkg build of the overlay port in .github/vcpkg/ports/gdal: the newest release), not Ubuntu's gdal-bin, which is
      # years behind: the check should read the files as the program does. The key and the build are those of build.yml's Linux job, so the install tree
      # the packages made (the cache is shared by the workflows of a branch) is taken when it is there, and built here (about 20 minutes, once) when not.
      - name: vcpkg cache key
        id: vcpkg-key
        run: |
          commit="$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)"
          inputs="$(cat .github/vcpkg/vcpkg.json .github/vcpkg/triplets/x64-linux-dynamic-release.cmake $(find .github/vcpkg/ports -type f | sort) | sha256sum | cut -c1-16)"
          echo "key=gdal-x64-linux-dynamic-release-$commit-$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore GDAL build
        id: gdal-cache
        uses: actions/cache@v6
        with:
          path: ~/gdal-vcpkg
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Build GDAL (vcpkg)
        if: steps.gdal-cache.outputs.cache-hit != 'true'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install \
            --x-manifest-root=.github/vcpkg \
            --x-install-root="$HOME/gdal-vcpkg" \
            --x-buildtrees-root="$HOME/vb" \
            --overlay-triplets=.github/vcpkg/triplets \
            --overlay-ports=.github/vcpkg/ports \
            --triplet x64-linux-dynamic-release \
            --clean-after-build

      # The tools are found on the PATH by the program. Each is a small script that puts the build's libraries on the library path for that one run: the libraries are
      # kept off the whole job's path, so they do not meet Qt's or the system's (the AppImage keeps them apart in the same way).
      - name: Put the GDAL tools on the PATH
        run: |
          prefix="$HOME/gdal-vcpkg/x64-linux-dynamic-release"
          mkdir -p "$HOME/gdalbin"
          for tool in "$prefix"/tools/gdal/*; do
            [ -x "$tool" ] && [ -f "$tool" ] || continue
            printf '#!/bin/sh\nLD_LIBRARY_PATH="%s/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" exec "%s" "$@"\n' "$prefix" "$tool" > "$HOME/gdalbin/$(basename "$tool")"
            chmod +x "$HOME/gdalbin/$(basename "$tool")"
          done
          echo "$HOME/gdalbin" >> "$GITHUB_PATH"
          echo "GDAL_DATA=$prefix/share/gdal" >> "$GITHUB_ENV"
          echo "PROJ_DATA=$prefix/share/proj" >> "$GITHUB_ENV"
          echo "PROJ_LIB=$prefix/share/proj" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$prefix/lib" "$prefix/tools/gdal/gdalinfo" --version

      - name: Generate resources + .pro
        run: |
          cd resourceCreation
          ./createResourcesImage.py
          ./createResourcesRes.py
          cd ..
          ./makeAll.py --pro --qt5   # (the official Qt has the plain 'qmake', no qmake6)

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Build
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          make -j"$(nproc)" CXX="sccache g++"
          sccache --show-stats

      - name: Restore what the last check found
        id: last
        uses: actions/cache/restore@v6
        with:
          path: |
            .xdg-data/wxqt/servers/catalog-status.json
            .xdg-data/wxqt/servers/servers-status.json
          key: catalog-status-none
          restore-keys: |
            catalog-status-

      # What this check ran on, in the run's summary: the versions, and which of the caches were hit (a miss on GDAL means this run built it, about 20 minutes)
      - name: Summary of what the check ran on
        env:
          QT_VERSION: ${{ steps.qt.outputs.version }}
          GDAL_CACHE_HIT: ${{ steps.gdal-cache.outputs.cache-hit }}
          GDAL_CACHE_KEY: ${{ steps.vcpkg-key.outputs.key }}
          LAST_CACHE_HIT: ${{ steps.last.outputs.cache-hit }}
          LAST_CACHE_KEY: ${{ steps.last.outputs.cache-matched-key }}
        run: |
          # (the cache action says "true" only for an exact key; the last check's results are found by the newest key that begins as theirs, so "false" with a key is a restore from an older one)
          yesno() { if [ "$1" = true ]; then echo "hit"; elif [ -n "$2" ]; then echo "restored from an older key"; else echo "miss"; fi; }
          gdal="$(PATH="$HOME/gdalbin:$PATH" gdalinfo --version 2>/dev/null | head -1)"
          {
            echo "## What the check ran on"
            echo
            echo "| | | |"
            echo "|---|---|---|"
            echo "| Qt | ${QT_VERSION:-unknown} | official binaries (aqtinstall; the packages' version) |"
            echo "| GDAL | ${gdal:-unknown} | build cache: **$(yesno "$GDAL_CACHE_HIT" "")** (\`${GDAL_CACHE_KEY}\`) |"
            echo "| the last check's results | $( [ -n "$LAST_CACHE_KEY" ] && echo found || echo "none: nothing can be gone on a first run" ) | cache: **$(yesno "$LAST_CACHE_HIT" "$LAST_CACHE_KEY")**${LAST_CACHE_KEY:+ (\`$LAST_CACHE_KEY\`)} |"
            echo "| compiler | $(g++ --version | head -1) | sccache: see the Build step |"
            echo "| qmake | $(qmake -v 2>/dev/null | sed -n 2p) | |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ask every model's server (the state of each source)
        run: |
          mkdir -p .xdg-data/wxqt/servers .xdg-config
          timeout 1500 build/release/wxqt 2>sources.log || true
          ls -la sources.json || true
        env:
          WXQT_OPEN: 'sourcecheck:*:sources.json'

      - name: Check every model
        run: |
          mkdir -p .xdg-data/wxqt/servers .xdg-config
          # a model's check reads indexes only (no field is downloaded); 6 models at a time; the run stops itself at 40 minutes
          timeout 2400 build/release/wxqt 2>catalog.log || true
          ls -la catalog.json || true
        env:
          WXQT_OPEN: 'catalogcheck:*:catalog.json'

      - name: Read the states
        id: states
        run: |
          python3 - <<'PY'
          import json, os
          try:
              data = json.load(open('sources.json'))
          except Exception as e:
              print('::warning::the source check wrote no result:', e)
              open(os.environ['GITHUB_OUTPUT'], 'a').write('trouble=0\n')
              raise SystemExit(0)
          # the catalogue check runs after this one and may add "Changed"; the state read here is the source's own
          trouble = [m for m in data if m['state'] in ('Moved', 'Down', 'Retired')]
          counts = {}
          for m in data:
              if not m['skipped']:
                  counts[m['state'] or 'Unknown'] = counts.get(m['state'] or 'Unknown', 0) + 1
          lines = ['## Sources', '', ', '.join(f'{n} {k}' for k, n in sorted(counts.items())) + '.', '']
          if trouble:
              lines += ['| model | state | server | answered by | what was found |', '|---|---|---|---|---|']
              for m in trouble:
                  lines.append(f"| {m['model']} | {m['state']} | {m['server']} | {m['moved_to']} | {m['detail'][:120]} |")
          body = ['These models\' sources are Moved (the first place of the server did not answer and a fallback did), Down (the last checks failed) or Retired (down, and last OK over a week ago):', '']
          for m in trouble:
              body.append(f"- **{m['model']}** ({m['state']}): server `{m['server'] or 'none'}`" + (f", answered by `{m['moved_to']}`" if m['moved_to'] else '') + f": {m['detail'][:160]}")
          body += ['', 'A moved server is one line in servers/servers.json (the base the model\'s url names with {@name}); see docs/server-file.md.',
                   '', f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]
          open('sources.md', 'w').write('\n'.join(lines) + '\n')
          open('sources-issue.md', 'w').write('\n'.join(body) + '\n')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'trouble={len(trouble)}\n')
          PY
          [ -f sources.md ] && cat sources.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Read the result
        id: result
        run: |
          python3 - <<'PY'
          import json, os
          try:
              data = json.load(open('catalog.json'))
          except Exception as e:
              print('::error::the check wrote no result:', e)
              raise SystemExit(1)
          checked = [m for m in data if m['checked']]
          gone = [(m['model'], f) for m in checked for f in m['gone']]
          never = [(m['model'], f) for m in checked for f in m['never_found']]
          lines = ['## Catalogue check', '',
                   f'{len(data)} models, {len(checked)} checked, **{len(gone)} fields gone**, {len(never)} never found.', '',
                   '| model | run | result |', '|---|---|---|']
          for m in sorted(data, key=lambda m: m['model']):
              lines.append(f"| {m['model']} | {m['run']} | {m['summary']} |")
          def name(f):
              return f"{f['variable']}@{f['level']}" + (f"|{f['detail']}" if f.get('detail') else '')
          body = ['These fields are asked for by the program\'s charts, were in the model\'s files at the last check, and are not in the newest run:', '']
          for model, f in gone:
              body.append(f"- **{model}**: `{name(f)}`")
          body += ['', 'A renamed variable or a dropped level. Fix the model file (`url`, `file` and `nc_variable` rules; see docs/model-files.md and docs/editing-rules.md) or take the field out of the model\'s `clone_levels` / `clone_fields`.',
                   '', f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"]
          open('summary.md', 'w').write('\n'.join(lines) + '\n')
          open('issue.md', 'w').write('\n'.join(body) + '\n')
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'gone={len(gone)}\n')
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Make the field catalogue (families, which models have which)
        if: always() && hashFiles('catalog.json') != ''
        run: python3 tools/catalog_report.py catalog.json catalog-report

      - name: Keep what this check found for the next one
        if: always() && hashFiles('.xdg-data/wxqt/servers/catalog-status.json') != ''
        uses: actions/cache/save@v6
        with:
          path: |
            .xdg-data/wxqt/servers/catalog-status.json
            .xdg-data/wxqt/servers/servers-status.json
          key: catalog-status-${{ github.run_id }}

      - name: Keep the full result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-check
          path: |
            catalog.json
            catalog.log
            sources.json
            sources.log
            catalog-report/
            deps.md
          retention-days: 30
          if-no-files-found: warn

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GONE: ${{ steps.result.outputs.gone }}
        run: |
          title="Catalogue check: fields gone from a model's files"
          number="$(gh issue list --label catalog-check --state open --json number --jq '.[0].number // empty')"
          gh label create catalog-check --description "The daily catalogue check found a change in a model's files" --color D93F0B 2>/dev/null || true
          if [ "${GONE:-0}" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file issue.md
              gh issue comment "$number" --body "Still gone at $(date -u +%F): ${GONE} field(s). See the run for the lists."
            else
              gh issue create --title "$title" --label catalog-check --body-file issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Nothing is gone from any model's files at $(date -u +%F)."
          fi

      - name: Open, update or close the source-status issue
        if: always() && steps.states.outputs.trouble != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TROUBLE: ${{ steps.states.outputs.trouble }}
        run: |
          title="Model sources: a server moved, is down or is retired"
          number="$(gh issue list --label source-status --state open --json number --jq '.[0].number // empty')"
          gh label create source-status --description "The daily source check found a server that moved, is down or is retired" --color FBCA04 2>/dev/null || true
          if [ "${TROUBLE:-0}" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file sources-issue.md
              gh issue comment "$number" --body "Still so at $(date -u +%F): ${TROUBLE} model(s)."
            else
              gh issue create --title "$title" --label source-status --body-file sources-issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every source answers at its first place at $(date -u +%F)."
          fi

      - name: GDAL release (the version the packages are built with against the newest)
        id: gdal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api repos/OSGeo/gdal/releases/latest --jq .tag_name 2>/dev/null | sed 's/^v//')"
          bundled="$(python3 -c "import json; print(json.load(open('.github/vcpkg/ports/gdal/vcpkg.json'))['version-semver'])")"
          if [ -z "$latest" ]; then
            echo "::warning::GitHub did not give the newest GDAL release"
            echo "behind=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          newest="$(printf '%s\n%s\n' "$bundled" "$latest" | sort -V | tail -1)"
          behind=0
          [ "$newest" != "$bundled" ] && behind=1
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "bundled=$bundled" >> "$GITHUB_OUTPUT"
          {
            echo "## GDAL"
            echo
            if [ "$behind" = 1 ]; then echo "The packages are built with GDAL **$bundled**; the newest release is **$latest**."; else echo "The packages are built with GDAL **$bundled**, the newest release ($latest)."; fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "GDAL $latest is out (https://github.com/OSGeo/gdal/releases/tag/v$latest); the packages are built with $bundled."
            echo
            echo "To move: in .github/vcpkg/ports/gdal set \`version-semver\` in vcpkg.json and \`SHA512\` in portfile.cmake (the hash of \`https://github.com/OSGeo/gdal/archive/v$latest.tar.gz\`: \`sha512sum\`), compare the patches with vcpkg's own gdal port (ports/gdal at microsoft/vcpkg; they apply with \`patch -p1\` to the new source), then run the \"Build portable packages\" workflow: its smoke tests print \"Bundled GDAL\"."
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > gdal-issue.md

      - name: Open, update or close the GDAL issue
        if: always() && steps.gdal.outputs.behind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.gdal.outputs.behind }}
          LATEST: ${{ steps.gdal.outputs.latest }}
          BUNDLED: ${{ steps.gdal.outputs.bundled }}
        run: |
          number="$(gh issue list --label gdal-update --state open --json number --jq '.[0].number // empty')"
          gh label create gdal-update --description "A newer GDAL release is out than the one the packages are built with" --color 0E8A16 2>/dev/null || true
          if [ "$BEHIND" = 1 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --title "GDAL $LATEST is out (the packages have $BUNDLED)" --body-file gdal-issue.md
            else
              gh issue create --title "GDAL $LATEST is out (the packages have $BUNDLED)" --label gdal-update --body-file gdal-issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "The packages have GDAL $BUNDLED, the newest release, at $(date -u +%F)."
          fi

      - name: Dependencies (what the packages are built with against the newest releases)
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/deps_check.py --workflows .github/workflows --out deps.md --issue deps-issue.md | tee deps.out
          sed -n 's/^behind=\([0-9]*\) patch=.*/behind=\1/p' deps.out >> "$GITHUB_OUTPUT"
          cat deps.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the dependencies issue
        if: always() && steps.deps.outputs.behind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.deps.outputs.behind }}
        run: |
          title="Dependencies: some are behind their newest release"
          number="$(gh issue list --label deps-update --state open --json number --jq '.[0].number // empty')"
          gh label create deps-update --description "A dependency of the packages is a major or minor version behind its newest release" --color 5319E7 2>/dev/null || true
          if [ "${BEHIND:-0}" -gt 0 ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file deps-issue.md
            else
              gh issue create --title "$title" --label deps-update --body-file deps-issue.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every dependency is at its newest major and minor version at $(date -u +%F)."
          fi

      - name: Fail when a field is gone
        if: steps.result.outputs.gone != '0'
        run: |
          echo "::error::${{ steps.result.outputs.gone }} field(s) are gone from a model's files (the issue and the run summary list them)"
          exit 1
