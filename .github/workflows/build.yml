name: Build portable packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Official Qt binaries via aqtinstall (MSVC build). The default "lite"
      # wxqt build no longer uses QtWebEngine, so no extra Qt modules are
      # needed. (Kept as MSVC + official Qt rather than MSYS2 so that turning
      # ./makeAll.py --webengine back on stays possible: MSYS2 does not
      # package QtWebEngine for any subsystem.)
      - name: Install Qt (MSVC, official binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # Loads the Visual Studio x64 build environment (cl, nmake, INCLUDE/LIB)
      # for the later steps. Done by hand rather than with ilammy/msvc-dev-cmd,
      # whose latest release (v1.13.0) still declares Node 20 and so keeps
      # raising the Node deprecation warning: run vcvars64.bat once, capture
      # the environment it produces, and export it through GITHUB_ENV.
      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ x64 tools was not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }

      # GDAL runs as a separate subprocess (QStandardPaths::findExecutable
      # ("gdalwarp"), never linked into wxqt.exe) - the MinGW/MSVC toolchain
      # mismatch between it and wxqt.exe doesn't matter, so MSYS2's
      # pacman-built GDAL (which DOES exist, unlike QtWebEngine) is still
      # the simplest source for it.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gdal
          path-type: minimal

      - name: Generate resources + .pro
        shell: pwsh
        run: |
          cd resourceCreation
          python createResourcesImage.py
          python createResourcesRes.py
          cd ..
          # --qt5 is a misnomer in makeAll.py - it just means "call the
          # qmake binary plain 'qmake', not 'qmake6'". Official/aqt Qt
          # installs only ever have the plain name (no version suffix,
          # since each version lives in its own isolated directory) -
          # that MSYS2/Linux-distro numbered-binary convention (qmake6,
          # windeployqt6) exists only to let Qt5/Qt6 coexist system-wide.
          python makeAll.py --pro --qt5

      - name: Build
        shell: cmd
        run: nmake

      - name: Package portable folder
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: .github/scripts/package-windows.ps1

      # Where the download size comes from (biggest first) - printed to the
      # job log so package size can be tuned without downloading the artifact.
      - name: Package size report
        shell: pwsh
        run: |
          $root = (Resolve-Path dist/wxqt-portable).Path
          Write-Host "== top-level entries"
          Get-ChildItem $root | ForEach-Object {
            $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ MB = [math]::Round($size / 1MB, 1); Name = $_.Name }
          } | Sort-Object MB -Descending | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "== 25 largest files"
          Get-ChildItem $root -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($root.Length + 1) } | Write-Host

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/wxqt-portable/* -DestinationPath dist/wxqt-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the file as-is - otherwise GitHub wraps our
          # zip in a second zip. (The artifact is named after the file.)
          path: dist/wxqt-windows-x64.zip
          archive: false
          if-no-files-found: error

  linux-x64-appimage:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19.
    # An AppImage only runs on systems with at least the glibc it was built
    # against, so the older LTS baseline reaches more distros; switch to 26.04
    # deliberately (its Qt / GDAL package names and versions need re-checking).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make \
            qt6-base-dev \
            gdal-bin libgdal-dev

      - name: Generate resources + .pro
        run: |
          cd resourceCreation
          ./createResourcesImage.py
          ./createResourcesRes.py
          cd ..
          ./makeAll.py --pro

      - name: Build
        run: make -j"$(nproc)"

      - name: Package AppImage
        run: bash .github/scripts/package-linux-appimage.sh

      # Where the download size comes from (biggest first) - see the Windows job.
      - name: Package size report
        run: |
          echo "== AppDir top level"
          du -sm AppDir/usr/* AppDir/usr/gdal/* 2>/dev/null | sort -rn | head -12
          echo "== 25 largest files"
          find AppDir -type f -printf '%s %P\n' | sort -rn | head -25 | awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          # as-is, so the AppImage downloads directly instead of zipped
          path: dist/wxqt-x86_64.AppImage
          archive: false
          if-no-files-found: error
