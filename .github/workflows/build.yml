name: Build portable packages

on:
  push:
    branches: [main]
    # documentation-only pushes do not need a 30-minute build
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

jobs:
  # Seconds, no Qt: the sounding engine against SPC's own computed values (tests/sounding/README.md)
  sounding-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Sounding engine vs SPC
        run: tests/sounding/run.sh

  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Official Qt binaries via aqtinstall (MSVC build). The default "lite"
      # wxqt build no longer uses QtWebEngine, so no extra Qt modules are
      # needed. (Kept as MSVC + official Qt rather than MSYS2 so that turning
      # ./makeAll.py --webengine back on stays possible: MSYS2 does not
      # package QtWebEngine for any subsystem.)
      - name: Install Qt (MSVC, official binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'

      # Loads the Visual Studio x64 build environment (cl, nmake, INCLUDE/LIB)
      # for the later steps. Done by hand rather than with ilammy/msvc-dev-cmd,
      # whose latest release (v1.13.0) still declares Node 20 and so keeps
      # raising the Node deprecation warning: run vcvars64.bat once, capture
      # the environment it produces, and export it through GITHUB_ENV.
      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with the C++ x64 tools was not found" }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
            }
          }

      # GDAL runs as a separate subprocess (QStandardPaths::findExecutable
      # ("gdalwarp"), never linked into wxqt.exe). Built by vcpkg with only
      # what wxqt uses (.github/vcpkg/vcpkg.json: core drivers - GRIB, GTiff,
      # PNG, XYZ, ENVI, VRT, GeoJSON - plus GEOS, SQLite, OpenJPEG). A full
      # distro GDAL (MSYS2's, used before) pulls in Arrow/Parquet, HEIF video
      # codecs, PDF, HDF5, OpenBLAS... - over 100 MB of DLLs nothing here loads.
      # The install tree is cached, so the ~20 min build only reruns when the
      # manifest or the runner image's vcpkg checkout changes.
      - name: vcpkg cache key
        id: vcpkg-key
        shell: pwsh
        run: |
          $commit = git -C "$env:VCPKG_INSTALLATION_ROOT" rev-parse HEAD
          $manifest = (Get-FileHash .github/vcpkg/vcpkg.json).Hash
          "key=gdal-x64-windows-release-$commit-$manifest" >> $env:GITHUB_OUTPUT
          $webpManifest = (Get-FileHash .github/vcpkg-webp/vcpkg.json).Hash
          "webp=webp-x64-windows-release-$commit-$webpManifest" >> $env:GITHUB_OUTPUT

      - name: Restore GDAL build
        id: gdal-cache
        uses: actions/cache@v5
        with:
          path: D:/gdal-vcpkg
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Build GDAL (vcpkg)
        if: steps.gdal-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            --x-manifest-root=.github/vcpkg `
            --x-install-root=D:/gdal-vcpkg `
            --x-buildtrees-root=D:/vb `
            --triplet x64-windows-release `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      # img2webp (libwebp) for the Save dialog's WebP export - bundled in the
      # package's tools/ folder. Its own manifest and cache, a few minutes to build.
      - name: Restore img2webp build
        id: webp-cache
        uses: actions/cache@v5
        with:
          path: D:/webp-vcpkg
          key: ${{ steps.vcpkg-key.outputs.webp }}

      - name: Build img2webp (vcpkg)
        if: steps.webp-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install `
            --x-manifest-root=.github/vcpkg-webp `
            --x-install-root=D:/webp-vcpkg `
            --x-buildtrees-root=D:/vb `
            --triplet x64-windows-release `
            --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed" }

      - name: Generate resources + .pro
        shell: pwsh
        run: |
          cd resourceCreation
          python createResourcesImage.py
          python createResourcesRes.py
          cd ..
          # --qt5 is a misnomer in makeAll.py - it just means "call the
          # qmake binary plain 'qmake', not 'qmake6'". Official/aqt Qt
          # installs only ever have the plain name (no version suffix,
          # since each version lives in its own isolated directory) -
          # that MSYS2/Linux-distro numbered-binary convention (qmake6,
          # windeployqt6) exists only to let Qt5/Qt6 coexist system-wide.
          python makeAll.py --pro --qt5

      - name: Build
        shell: cmd
        run: nmake

      - name: Package portable folder
        shell: pwsh
        env:
          GDAL_PREFIX: D:/gdal-vcpkg/x64-windows-release
          WEBP_PREFIX: D:/webp-vcpkg/x64-windows-release
        run: .github/scripts/package-windows.ps1

      # Runs the bundled GDAL tools the way wxqt does, with only the package's
      # own gdal/ folder (plus Windows itself) on PATH: fails on a missing DLL
      # or a driver the app needs that the minimal build left out.
      - name: Smoke-test bundled GDAL
        shell: pwsh
        run: |
          $gdal = (Resolve-Path dist/wxqt-portable/gdal).Path
          $env:PATH = "$gdal;$env:SystemRoot\System32;$env:SystemRoot"
          $env:GDAL_DATA = "$gdal\gdal-data"
          $env:PROJ_DATA = "$gdal\proj-data"
          $formats = (gdalinfo --formats) + (ogrinfo --formats)
          foreach ($driver in "GRIB", "GTiff", "PNG", "XYZ", "ENVI", "VRT", "MEM", "GeoJSON") {
            if (-not ($formats -match "^\s*$driver\b")) { throw "GDAL driver $driver missing" }
          }
          $t = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/gdalsmoke"
          $rows = foreach ($j in 0..59) { (0..89 | ForEach-Object { 50 + 30 * [math]::Sin($_ / 13) * [math]::Cos($j / 9) }) -join " " }
          (@("ncols 90", "nrows 60", "xllcorner -110", "yllcorner 25", "cellsize 0.2", "NODATA_value -9999") + $rows) | Set-Content "$t/f.asc"
          function Run { & $args[0] $args[1..($args.Count - 1)]; if ($LASTEXITCODE -ne 0) { throw "failed: $args" } }
          Run gdal_translate -q -a_srs EPSG:4326 "$t/f.asc" "$t/f.tif"
          Run gdalwarp -q -t_srs EPSG:3857 -r cubicspline -ts 190 0 "$t/f.tif" "$t/w.tif"
          Run gdal_translate -q -of ENVI -ot Float32 "$t/w.tif" "$t/w.raw"
          Run gdaldem color-relief "$t/f.tif" .github/vcpkg/smoke-colors.txt "$t/c.tif" -alpha
          Run gdal_translate -q -of PNG "$t/c.tif" "$t/c.png"
          Run gdal_contour -q -a elev -i 10 "$t/f.tif" "$t/cr.geojson"
          Run ogr2ogr -q -f GeoJSON "$t/cs.geojson" "$t/cr.geojson" -simplify 0.06
          Run ogr2ogr -q -f GeoJSON "$t/cb.geojson" "$t/cs.geojson" -dialect sqlite -sql "SELECT ST_Buffer(geometry, 0.02) AS geometry FROM contour"
          Run gdal_rasterize -q -burn 255 -ts 90 60 -ot Byte "$t/cb.geojson" "$t/r.tif"
          # GRIB read back, incl. the complex- and JPEG2000-packed GRIB2 NCEP uses
          Run gdal_translate -q -of GRIB -co DATA_ENCODING=COMPLEX_PACKING "$t/f.tif" "$t/f.grb2"
          Run gdal_translate -q -of GRIB -co DATA_ENCODING=JPEG2000 "$t/f.tif" "$t/j.grb2"
          Run gdalinfo -mm "$t/f.grb2"
          Run gdalinfo -mm "$t/j.grb2"
          Run gdallocationinfo -valonly -wgs84 "$t/f.tif" -100 30
          Run gdalinfo -mm "$t/w.tif"
          Write-Host "bundled GDAL OK"

      # the bundled img2webp, run the way the Save dialog runs it (lossy with a
      # last-frame pause, and lossless) with only tools/ on PATH
      - name: Smoke-test bundled img2webp
        shell: pwsh
        run: |
          $tools = (Resolve-Path dist/wxqt-portable/tools).Path
          $env:PATH = "$tools;$env:SystemRoot\System32;$env:SystemRoot"
          $t = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/webpsmoke"
          Add-Type -AssemblyName System.Drawing
          foreach ($i in 0..2) {
            $bmp = New-Object System.Drawing.Bitmap 120, 80
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(255, 40 * $i, 90, 200 - 40 * $i))
            $g.Dispose()
            $bmp.Save("$t/frame_000$i.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $bmp.Dispose()
          }
          & img2webp -loop 0 -sharp_yuv -lossy -q 90 -m 4 -d 500 "$t/frame_0000.png" "$t/frame_0001.png" -d 2500 "$t/frame_0002.png" -o "$t/a.webp"
          if ($LASTEXITCODE -ne 0) { throw "img2webp (lossy) failed" }
          & img2webp -loop 3 -lossless -q 75 -m 4 -d 300 "$t/frame_0000.png" "$t/frame_0001.png" -o "$t/b.webp"
          if ($LASTEXITCODE -ne 0) { throw "img2webp (lossless) failed" }
          & img2webp -mixed -lossy -q 80 -m 6 -d 300 "$t/frame_0000.png" "$t/frame_0001.png" -o "$t/c.webp"
          if ($LASTEXITCODE -ne 0) { throw "img2webp (mixed) failed" }
          Write-Host "bundled img2webp OK"

      # Where the download size comes from (biggest first) - printed to the
      # job log so package size can be tuned without downloading the artifact.
      - name: Package size report
        shell: pwsh
        run: |
          $root = (Resolve-Path dist/wxqt-portable).Path
          Write-Host "== top-level entries"
          Get-ChildItem $root | ForEach-Object {
            $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ MB = [math]::Round($size / 1MB, 1); Name = $_.Name }
          } | Sort-Object MB -Descending | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "== 25 largest files"
          Get-ChildItem $root -Recurse -File | Sort-Object Length -Descending | Select-Object -First 25 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring($root.Length + 1) } | Write-Host

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/wxqt-portable/* -DestinationPath dist/wxqt-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the file as-is - otherwise GitHub wraps our
          # zip in a second zip. (The artifact is named after the file.)
          path: dist/wxqt-windows-x64.zip
          archive: false
          if-no-files-found: error

  linux-x64-appimage:
    # Pinned rather than ubuntu-latest, which moves to Ubuntu 26 on 2026-10-19.
    # An AppImage only runs on systems with at least the glibc it was built
    # against, so the older LTS baseline reaches more distros; switch to 26.04
    # deliberately (its Qt / GDAL package names and versions need re-checking).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make \
            qt6-base-dev \
            webp

      # GDAL runs as a separate subprocess (never linked into wxqt). Built by vcpkg
      # with only what wxqt uses - the same minimal manifest as the Windows job
      # (.github/vcpkg/vcpkg.json) - as shared libraries, release only (triplet
      # overlay in .github/vcpkg/triplets). The distro GDAL (gdal-bin, used before)
      # drags in MySQL, LAPACK, poppler, HDF5, Xerces, ... - ~110 MB unpacked of
      # which wxqt loads none. The install tree is cached; the build only reruns
      # when the manifest, triplet or the runner image's vcpkg checkout changes.
      - name: vcpkg cache key
        id: vcpkg-key
        run: |
          commit="$(git -C "$VCPKG_INSTALLATION_ROOT" rev-parse HEAD)"
          inputs="$(cat .github/vcpkg/vcpkg.json .github/vcpkg/triplets/x64-linux-dynamic-release.cmake | sha256sum | cut -c1-16)"
          echo "key=gdal-x64-linux-dynamic-release-$commit-$inputs" >> "$GITHUB_OUTPUT"

      - name: Restore GDAL build
        id: gdal-cache
        uses: actions/cache@v5
        with:
          path: ~/gdal-vcpkg
          key: ${{ steps.vcpkg-key.outputs.key }}

      - name: Build GDAL (vcpkg)
        if: steps.gdal-cache.outputs.cache-hit != 'true'
        run: |
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install \
            --x-manifest-root=.github/vcpkg \
            --x-install-root="$HOME/gdal-vcpkg" \
            --x-buildtrees-root="$HOME/vb" \
            --overlay-triplets=.github/vcpkg/triplets \
            --triplet x64-linux-dynamic-release \
            --clean-after-build

      - name: Generate resources + .pro
        run: |
          cd resourceCreation
          ./createResourcesImage.py
          ./createResourcesRes.py
          cd ..
          ./makeAll.py --pro

      - name: Build
        run: make -j"$(nproc)"

      - name: Package AppImage
        run: |
          export GDAL_PREFIX="$HOME/gdal-vcpkg/x64-linux-dynamic-release"
          bash .github/scripts/package-linux-appimage.sh

      # The bundled GDAL tools, run from a clean environment with only the
      # AppDir's own folders on PATH / the library path (see the script).
      - name: Smoke-test bundled GDAL
        run: |
          root="$PWD/AppDir/usr"
          env -i HOME="$HOME" PATH="$root/gdal/bin:/usr/bin:/bin" \
            LD_LIBRARY_PATH="$root/gdal/lib:$root/lib" \
            GDAL_DATA="$root/gdal/share-gdal-data" PROJ_DATA="$root/gdal/share-proj-data" PROJ_LIB="$root/gdal/share-proj-data" \
            bash .github/vcpkg/smoke-linux.sh "$RUNNER_TEMP/gdalsmoke"

      # The finished AppImage must actually start: run it headless for a few
      # seconds. timeout's exit code 124 means it was still running when stopped
      # (good); a crash or missing library ends it sooner with another code.
      - name: Smoke-test AppImage starts
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 12 ./dist/wxqt-x86_64.AppImage --appimage-extract-and-run
          code=$?
          echo "exit code $code (124 = still running when stopped, which is what we want)"
          [ "$code" -eq 124 ]

      # Where the download size comes from (biggest first) - see the Windows job.
      - name: Package size report
        run: |
          echo "== AppDir top level"
          du -sm AppDir/usr/* AppDir/usr/gdal/* 2>/dev/null | sort -rn | head -12
          echo "== 25 largest files"
          find AppDir -type f -printf '%s %P\n' | sort -rn | head -25 | awk '{ printf "%8.1f MB  %s\n", $1/1048576, $2 }'
          ls -l dist/

      - uses: actions/upload-artifact@v7
        with:
          # as-is, so the AppImage downloads directly instead of zipped
          path: dist/wxqt-x86_64.AppImage
          archive: false
          if-no-files-found: error
