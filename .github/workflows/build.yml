name: Build portable packages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSYS2 does not package QtWebEngine for ANY subsystem (MinGW64,
      # UCRT64, CLANG64) - Chromium's build has historically only worked
      # with MSVC on Windows. wxqt.pro unconditionally requires
      # webenginewidgets, so wxqt.exe itself has to be an MSVC build -
      # official Qt binaries via aqtinstall, not pacman.
      - name: Install Qt (MSVC, official binaries)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine qtpositioning qtwebchannel'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # GDAL runs as a separate subprocess (QStandardPaths::findExecutable
      # ("gdalwarp"), never linked into wxqt.exe) - the MinGW/MSVC toolchain
      # mismatch between it and wxqt.exe doesn't matter, so MSYS2's
      # pacman-built GDAL (which DOES exist, unlike QtWebEngine) is still
      # the simplest source for it.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gdal
          path-type: minimal

      - name: Generate resources + .pro
        shell: pwsh
        run: |
          cd resourceCreation
          python createResourcesImage.py
          python createResourcesRes.py
          cd ..
          # --qt5 is a misnomer in makeAll.py - it just means "call the
          # qmake binary plain 'qmake', not 'qmake6'". Official/aqt Qt
          # installs only ever have the plain name (no version suffix,
          # since each version lives in its own isolated directory) -
          # that MSYS2/Linux-distro numbered-binary convention (qmake6,
          # windeployqt6) exists only to let Qt5/Qt6 coexist system-wide.
          python makeAll.py --pro --qt5

      - name: Build
        shell: cmd
        run: nmake

      - name: Package portable folder
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: .github/scripts/package-windows.ps1

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/wxqt-portable/* -DestinationPath dist/wxqt-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: wxqt-windows-x64
          path: dist/wxqt-windows-x64.zip
          if-no-files-found: error

  linux-x64-appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make \
            qt6-base-dev qt6-webengine-dev qt6-declarative-dev \
            gdal-bin libgdal-dev

      - name: Generate resources + .pro
        run: |
          cd resourceCreation
          ./createResourcesImage.py
          ./createResourcesRes.py
          cd ..
          ./makeAll.py --pro

      - name: Build
        run: make -j"$(nproc)"

      - name: Package AppImage
        run: bash .github/scripts/package-linux-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wxqt-linux-x64-appimage
          path: dist/wxqt-x86_64.AppImage
          if-no-files-found: error
